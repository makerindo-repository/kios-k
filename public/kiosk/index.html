<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KIOS-K</title>
    <link rel="stylesheet" href="/kiosk/index.css">
</head>
<body>
    <div class="frame">
        <header>
            <div class="square ghost"></div>
            <div class="square"></div>
            <div>
                <div class="clock-container">
                    <p id="time">--:--:--</p>
                    <p id="date">Loading...</p>
                </div>
                <p id="message">Test</p>
            </div>
        </header>
        <main id="page-container">
            Loading...
        </main>
        <footer>
            <div class="mou">
                <h2>Our MoU</h2>
                <div class="mou-mover">
                    <div class="mou-set"></div> 
                    <div class="mou-set"></div>
                </div>
            </div>
            <div class="slogan"><p><b>Selamat berdiskusi dan berkarya</b></p></div>
            <div class="circle ghost"></div>
            <div class="circle"></div>
            <div class="bottom-blue"></div>
        </footer>
    </div>
    <script src="/kiosk/index.js" defer></script>
</body>
</html>
