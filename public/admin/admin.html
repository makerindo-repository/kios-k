<!DOCTYPE html>
<html>
    <head>
        <title>Manage Semua KIOS-K</title>
        <link rel="icon" type="image/x-icon" href="/assets/favicon.png">
        <link rel="stylesheet" href="/admin/admin.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css'>
        <script src="/admin/admin.js" defer></script>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    </head>
    <body>
        <!--Not hidden displays-->
        <div class="manage-container">
            <h1>Dashboard Admin KIOS-K</h1>
        </div>
        <div class="large-container">
            <div class="manage-container">
                <p>Jumlah KIOS-K</p>
                <h1 id="stat-all">N/A</h1>
            </div>
            <div class="manage-container">
                <p>Jumlah Aktif</p>
                <h1 id="stat-active">N/A</h1>
            </div>
            <div class="manage-container">
                <p>Jumlah Diblokir</p>
                <h1 id="stat-blocked">N/A</h1>
            </div>
            <div class="manage-container">
                <p>Jumlah Pengguna</p>
                <h1 id="stat-users">N/A</h1>
            </div>
        </div>
        <div class="manage-container"> <!--map-->
            <h1 id="page-title">Peta Lokasi KIOS-K</h1>
            <div id="map" style="height: 500px; width: 100%;"></div>
        </div>
        <div class="large-container">
            <div class="manage-container"> <!--kiosks table-->
                <h1>Daftar KIOS-K</h1>
                <div class="table-wrapper">
                    <table id="kiosk-table">
                        <thead>
                            <tr>
                                <th class="number">#</th>
                                <th>Pemilik</th>
                                <th>Nama KIOS-K</th>
                                <th>Status</th>
                                <th class="action">Aksi</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
            <div class="manage-container"> <!--kiosks table-->
                <h1>Daftar Pengguna</h1>
                <div class="table-wrapper">
                    <table id="user-table">
                        <thead>
                            <tr>
                                <th class="number">#</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th class="action">Aksi</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
        <div class="manage-container buttons"> <!--buttons, not tables though-->
            <button class="button alert logout">Logout</button>
        </div>
        
        <!--Hidden displays, all forms-->
        <div id="kiosk-modal" class="modal hidden"> <!--kiosk modal-->
            <div class="modal-content">
                <button type="button" id="cancel-edit" class="cancel-btn">X</button>
                <h2>Form KIOS-K</h2>
                <form id="kiosk-form">
                    <label>Nama: <br><input type="text" name="name"></label>
                    <label>Pemilik: <br><select name="owner"></select></label>
                    <input type="hidden" name="id">
                    <button type="submit" class="submit-btn">Tambah / Edit KIOS-K</button>
                </form>
            </div>
        </div>
        <div id="user-modal" class="modal hidden"> <!--user modal-->
            <div class="modal-content">
                <button type="button" id="cancel-add-user" class="cancel-btn">X</button>
                <h2>Form User</h2>
                <form id="user-form">
                    <label>Username: <br><input type="text" name="username"></label>
                    <label>Email: <br><input type="text" name="email"></label>
                    <label>Password: <br><input type="password" name="password"></label> <!--Find a way to make this password fields to change depending are we adding new user (confirm pass) or editing (check old password)-->
                    <!-- <label>Konfirmasi Password: <br><input type="password" name="confirm"></label> -->
                    <input type="hidden" name="id">
                    <button type="submit" class="submit-btn">Tambah / Edit Pengguna</button>
                </form>
            </div>
        </div>
    </body>
    <footer>
        <div class="socials">
            <a href="https://makerindo.co.id/"><button class="social"><i class="fi fi-rr-globe"></i></button></a>
            <a href="https://www.instagram.com/makerdotindo"><button class="social"><i class="fi fi-brands-instagram"></i></button></a>
            <a href="https://www.youtube.com/@makerindoprimasolusi"><button class="social"><i class="fi fi-brands-youtube"></i></button></a>
            <a href="https://www.linkedin.com/company/makerindo-prima-solusi/"><button class="social"><i class="fi fi-brands-linkedin"></i></button></a>
        </div>
        <p>© 2026 PT. Makerindo Prima Solusi | All Rights Reserved</p>
    </footer>
</html>
