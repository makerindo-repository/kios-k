<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="/login/login.css">
    </head>
    <body>
        <img src="../assets/logo.webp" class="logo">
        <div class="card">
            <h1>Login</h1>
            <form id="login-form">
                <input type="text" name="username" placeholder="Masukkan Username Disini" required>
                <input type="password" name="password" placeholder="Masukkan Password Disini" required>
                <button type="submit" class="button">Login</button>
            </form>
        </div>
        <div id="selection" class="selection card hidden">
        </div>
        <script src="/login/login.js"></script>
    </body>
</html>
