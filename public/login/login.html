<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <link rel="icon" type="image/x-icon" href="/assets/favicon.png">
        <link rel="stylesheet" href="/login/login.css">
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
        <script src="/login/login.js" defer></script>
    </head>
    <body>
        <img src="../assets/logo.webp" class="logo">
        <div class="card">
            <h1>Login</h1>
            <form id="login-form">
                <div class="field-with-icon">
                    <i class="fi fi-rr-envelope"></i>
                    <input type="text" name="useremail" id="useremail" placeholder="Masukkan Username / Email Disini">
                </div>
                <div class="field-with-icon">
                    <i class="fi fi-rr-key"></i>
                    <input type="password" name="password" id="password" placeholder="Masukkan Password Disini">
                </div>
                <button type="submit" class="button">Login</button>
                <div id="form-error" class="form-error"></div>
            </form>
        </div>
        <div id="selection" class="selection card hidden">
        </div>
    </body>
</html>
