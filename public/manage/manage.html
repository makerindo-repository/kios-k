<!DOCTYPE html>
<html>
    <head>
        <title>Manage Isi KIOS-K</title>
        <link rel="icon" type="image/x-icon" href="/assets/favicon.png">
        <link rel="stylesheet" href="/manage/manage.css">
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css'>
        <script src="/manage/manage.js" defer></script>
    </head>
    <body>
        <div class="manage-container">
            <h1 id="page-title">Daftar Halaman</h1>
            <div id="page-carousel" class="page-carousel">
            </div>
        </div>
        <div class="manage-container">
            <h1 id="page-title">Daftar MoU</h1>
            <div id="mou-carousel" class="mou-carousel"></div>
        </div>
        <div class="manage-container buttons">
            <button class="button alert logout">Logout</button>
        </div>
        <div id="page-modal" class="modal hidden">
            <div class="modal-content">
                <button type="button" id="cancel-add" class="cancel-btn"><b>X</b></button>
                <h2 id="page-modal-title">Form Halaman</h2>
                <form id="page-form">
                    <label>Heading: <br><input type="text" name="heading"></label>
                    <label>Judul: <br><input type="text" name="title"></label>
                    <label>Deskripsi: <br><textarea name="description"></textarea></label>
                    <label>Tipe Halaman: <br><select name="page_type">
                        <option value="single">Satu Foto</option>
                        <option value="multi">Banyak Foto</option>
                    </select></label>
                    <label>Foto <br><input type="file" name="photos" accept="image/*" multiple></label>
                    <input type="hidden" name="id">
                    <button type="submit" class="submit-btn">Tambah / Edit Halaman</button>
                </form>
            </div>
        </div>
        <div id="mou-modal" class="modal hidden">
            <div class="modal-content">
                <button type="button" id="cancel-add" class="cancel-btn">X</button>
                <h2>Form MoU</h2>
                <form id="mou-form">
                    <label>Logo <br><input type="file" name="image" accept="image/*" multiple></label>
                    <input type="hidden" name="id">
                    <button type="submit" class="submit-btn">Tambah  / Edit Logo</button>
                </form>
            </div>
        </div>
        <div id="welcome-modal" class="modal hidden">
            <div class="modal-content">
                <button type="button" id="cancel-add" class="cancel-btn button alert"><b>X</b></button>
                <h2>Form Halaman</h2>
                <form id="welcome-form">
                    <label>Kalimat: <br><input type="text" name="heading"></label>
                    <label>Deskripsi: <br><textarea name="description"></textarea></label>
                    <label>Foto <br><input type="file" name="photos" accept="image/*" multiple></label>
                    <input type="hidden" name="id">
                    <button type="submit" class="submit-btn">Edit Halaman Selamat Datang</button>
                </form>
            </div>
        </div>
    </body>
    <footer>
        <div class="socials">
            <a href="https://makerindo.co.id/"><button class="social"><i class="fi fi-rr-globe"></i></button></a>
            <a href="https://www.instagram.com/makerdotindo"><button class="social"><i class="fi fi-brands-instagram"></i></button></a>
            <a href="https://www.youtube.com/@makerindoprimasolusi"><button class="social"><i class="fi fi-brands-youtube"></i></button></a>
            <a href="https://www.linkedin.com/company/makerindo-prima-solusi/"><button class="social"><i class="fi fi-brands-linkedin"></i></button></a>
        </div>
        <p>© 2026 PT. Makerindo Prima Solusi | All Rights Reserved</p>
    </footer>
</html>
