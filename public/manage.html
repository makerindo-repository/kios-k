<!DOCTYPE html>
<html>
    <head>
        <title>Manage Content</title>
        <link rel="stylesheet" href="manage.css">
    </head>
    <body>
        <div class="manage-container">
            <h1 id="page-title">Daftar Halaman</h1>
            <div id="page-carousel" class="page-carousel"></div>

            <div id="add-page-modal" class="modal hidden">
                <div class="modal-content">
                    <button type="button" id="cancel-add" class="cancel-btn">X</button>
                    <h2>Form Halaman</h2>
                    <form id="add-page-form">
                        <label>Heading: <br><input type="text" name="heading"></label>
                        <label>Judul: <br><input type="text" name="title"></label>
                        <label>Deskripsi: <br><textarea name="desc"></textarea></label>
                        <label>Tipe Halaman: <br><select name="page_type">
                            <option value="single">Satu Foto</option>
                            <option value="multi">Banyak Foto</option>
                        </select></label>
                        <label>Foto <br><input type="file" name="photos" accept="image/*" multiple></label>
                        <input type="hidden" name="id">
                        <button type="submit" class="submit-btn">Tambah / Edit Halaman</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="manage-container">
            <h1 id="page-title">Daftar MoU</h1>
            <div id="mou-carousel" class="mou-carousel"></div>

            <div id="add-mou-modal" class="modal hidden">
                <div class="modal-content">
                    <button type="button" id="cancel-add" class="cancel-btn">X</button>
                    <h2>Form MoU</h2>
                    <form id="add-mou-form">
                        <label>Logo <br><input type="file" name="image" accept="image/*" multiple></label>
                        <input type="hidden" name="id">
                        <button type="submit" class="submit-btn">Tambah Logo</button>
                    </form>
                </div>
            </div>
        </div>
        <script src="manage.js"></script>
    </body>
    <footer>
        <p>Makerindo Prima Solusi, 2026-sekarang</p>
    </footer>
</html>
